# Конфигурация Render (Blueprint). Постоянный диск доступен только на платных тарифах.
services:
  - type: web
    name: craftory-mods
    runtime: node
    plan: starter
    region: frankfurt
    branch: ccr-c6a34cd1-ot9oms
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_PASSWORD
        generateValue: true
    disk:
      name: craftory-data
      mountPath: /var/data
      sizeGB: 1
